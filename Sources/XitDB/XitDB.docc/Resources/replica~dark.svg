<svg xmlns='http://www.w3.org/2000/svg' width='620' height='226' viewBox='0 0 620 226'><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#8e8e93'/></marker></defs><text x='16' y='50' text-anchor='start' font-size='13' fill='#a1a1a6' font-family='-apple-system, Helvetica, Arial, sans-serif'>the source</text><rect x='110' y='28' width='340' height='36' rx='6' fill='#2c2c2e' stroke='#8e8e93' stroke-width='1.5'/><text x='280.0' y='51.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#f5f5f7' font-family='-apple-system, Helvetica, Arial, sans-serif'>committed bytes the replica has</text><rect x='450' y='28' width='150' height='36' rx='6' fill='#123f1f' stroke='#5fd47a' stroke-width='1.5'/><text x='525.0' y='51.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#f5f5f7' font-family='-apple-system, Helvetica, Arial, sans-serif'>newer commits</text><text x='16' y='160' text-anchor='start' font-size='13' fill='#a1a1a6' font-family='-apple-system, Helvetica, Arial, sans-serif'>the replica</text><rect x='110' y='138' width='340' height='36' rx='6' fill='#2c2c2e' stroke='#8e8e93' stroke-width='1.5'/><text x='280.0' y='161.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#f5f5f7' font-family='-apple-system, Helvetica, Arial, sans-serif'>the same bytes</text><rect x='450' y='138' width='150' height='36' rx='6' fill='#123f1f' stroke='#5fd47a' stroke-width='1.5'/><text x='525.0' y='161.0' text-anchor='middle' font-size='14' font-weight='normal' fill='#f5f5f7' font-family='-apple-system, Helvetica, Arial, sans-serif'>the bytes it lacks</text><line x1='525' y1='64' x2='525' y2='136' stroke='#8e8e93' stroke-width='1.5' marker-end='url(#arrow)'/><text x='440' y='106' text-anchor='end' font-size='13' fill='#a1a1a6' font-family='-apple-system, Helvetica, Arial, sans-serif'>its state: committed size and checksum</text><line x1='450' y1='124' x2='450' y2='78' stroke='#8e8e93' stroke-width='1.5' stroke-dasharray='4 3' marker-end='url(#arrow)'/><text x='16' y='212' text-anchor='start' font-size='13' fill='#a1a1a6' font-family='-apple-system, Helvetica, Arial, sans-serif'>A commit never changes what came before it, so a sync is copying what follows.</text></svg>
