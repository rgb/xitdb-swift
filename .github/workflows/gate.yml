# The gate on the self-hosted runners, macOS and Linux: scripts/check.sh at every push and pull
# request.
#
# The macOS runner needs Xcode 27.2, whose Swift is 6.4.2, the one toolchain the gate accepts;
# check.sh checks it too, but only once it starts, and this workflow fails before anything is
# built, with the version it saw. If the runner has several Xcodes, select 27.2 with
# xcode-select or DEVELOPER_DIR on the runner. Nothing is cached: the runners are ours, and
# actions/checkout cleans the work tree, so every run builds from nothing.
name: Gate

on:
  push:
  pull_request:

# The token can read the repository and nothing more.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run before it.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Gate on macOS
    # A self-hosted runner never runs a fork's code unasked: pushes, and pull requests whose
    # head is in this repository. A fork's pull request waits for a maintainer.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the toolchain
        run: |
          expected="6.4.2"
          version=$(xcrun swiftc --version 2>&1)
          echo "$version"
          case "$version" in
            *"Swift version $expected "*) ;;
            *)
              echo "::error::the gate needs Swift $expected, which is Xcode 27.2's toolchain; this runner's xcrun swiftc reports the version above"
              exit 1
              ;;
          esac

      - name: Run the gate
        run: scripts/check.sh

  # The same gate on the Linux runner, in the official Swift container: the image is the
  # toolchain pin, Swift 6.4.2 on Ubuntu, and check.sh accepts any 6.4.x and prints the one
  # it has. The image is named by its digest as well as its tag, so that a tag pushed again
  # cannot change what runs here; a newer image comes in a commit. The image has git for
  # actions/checkout and everything check.sh calls. The runner brings its own node, which
  # on the NixOS runner is a link into /nix, so /nix is mounted read-only for it; without
  # the mount the checkout fails, unable to find /__e/node24/bin/node. A container job runs
  # as root, which may write a read-only file, so the one test that expects the system to
  # refuse that skips itself under root; the rest runs as it would under any user. check.sh
  # skips the iOS step on Linux.
  linux:
    name: Gate on Linux
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    container:
      image: swift:6.4.2@sha256:119ff7d833ea622851b459513333bb4bda5ebb32b7acd05dd05077d5b0383129
      options: --volume /nix:/nix:ro
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Run the gate
        run: scripts/check.sh
