# The benchmark, started by hand (workflow_dispatch) on the self-hosted runners, one job on
# macOS and one on Linux: the seven workloads at full size, the Swift package against the Zig
# original, three passes of each, alternated, and each job's table in its summary. The two
# run at once on different machines, so each table compares Swift with Zig on one machine;
# the tables are not meant to be compared with each other. It is a report and not a check:
# there are no thresholds, and a job fails only when a build or a benchmark does. Each job
# also keeps its summary and every pass's lines (bench-compare.py --raw) as an artifact of
# the run, benchmark-macos and benchmark-linux, which `gh run download` fetches.
#
# The macOS runner needs Xcode 27.2 (Swift 6.4.2) and Zig 0.17.1, on the PATH the runner's
# service has, which is short: put Zig's folder in the runner's .path file, or link zig into
# /usr/local/bin.
#
# The Linux job runs in the gate's Swift container, which brings Swift 6.4.2. The image has
# neither Python, which the comparison script needs, nor xz, which unpacking Zig needs, so
# the job installs both, then Zig 0.17.1 through mlugg/setup-zig, which checks the
# tarball's signature. Nothing is cached, as in the gate.
#
# The Zig side is the conformance repository's `bench`, built against the original xitdb,
# which its build.zig.zon takes from ../../xitdb. So the three repositories are checked out
# as they sit in the development workspace: xitdb-swift/package (this one),
# xitdb-swift/conformance and xitdb. The two commits are inputs with defaults, so that a
# run can take a newer harness or a newer original without a change here.
name: Benchmark

# The token can read the repository and nothing more.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      conformance_commit:
        description: "Commit of rgb/xitdb-conformance whose bench is built"
        required: true
        default: "e7f4c0d106b5dc9bc389a251eac283254310a3cd"
      xitdb_commit:
        description: "Commit of xit-vcs/xitdb the harness is built against"
        required: true
        default: "6b93af1af3a260399fa0a0b1b268ded2cbf5eec5"

jobs:
  compare:
    name: Swift against Zig
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CONFORMANCE_COMMIT: ${{ inputs.conformance_commit }}
      XITDB_COMMIT: ${{ inputs.xitdb_commit }}
    steps:
      - name: Check out the package
        uses: actions/checkout@v4
        with:
          path: xitdb-swift/package

      - name: Check out the conformance harness
        uses: actions/checkout@v4
        with:
          repository: rgb/xitdb-conformance
          ref: ${{ inputs.conformance_commit }}
          path: xitdb-swift/conformance
          # GITHUB_TOKEN reaches this repository only. If the conformance repository is
          # private, add a secret CONFORMANCE_TOKEN with read access to it.
          token: ${{ secrets.CONFORMANCE_TOKEN || github.token }}

      - name: Check out the original xitdb
        uses: actions/checkout@v4
        with:
          repository: xit-vcs/xitdb
          ref: ${{ inputs.xitdb_commit }}
          path: xitdb

      - name: Check the toolchains
        run: |
          expected_swift="6.4.2"
          version=$(xcrun swiftc --version 2>&1)
          echo "$version"
          case "$version" in
            *"Swift version $expected_swift "*) ;;
            *)
              echo "::error::the benchmark needs Swift $expected_swift, which is Xcode 27.2's toolchain; this runner's xcrun swiftc reports the version above"
              exit 1
              ;;
          esac
          expected_zig="0.17.1"
          if ! command -v zig > /dev/null; then
            echo "::error::zig is not on the runner's PATH; the benchmark needs Zig $expected_zig (add its folder to the runner's .path file)"
            exit 1
          fi
          zig_version=$(zig version)
          echo "zig $zig_version"
          if [ "$zig_version" != "$expected_zig" ]; then
            echo "::error::the benchmark needs Zig $expected_zig, and the runner's zig is $zig_version"
            exit 1
          fi

      - name: Build the Zig benchmark
        working-directory: xitdb-swift/conformance
        run: zig build -Doptimize=ReleaseFast --prefix out/release

      - name: Build the Swift benchmark
        working-directory: xitdb-swift/package
        run: swift build -c release --product XitDBBenchmark

      - name: Run both, three passes alternated
        working-directory: xitdb-swift/package
        run: |
          out="$GITHUB_WORKSPACE/results"
          mkdir -p "$out"
          {
            echo "## Benchmark: Swift against Zig"
            echo
            echo "- Swift: \`${GITHUB_REPOSITORY}\` at \`${GITHUB_SHA}\`, $(xcrun swiftc --version 2>&1 | head -n 1)"
            echo "- Zig: \`rgb/xitdb-conformance\` at \`${CONFORMANCE_COMMIT}\` against \`xit-vcs/xitdb\` at \`${XITDB_COMMIT}\`, Zig $(zig version), ReleaseFast"
            echo "- Runner: $(uname -m), macOS $(sw_vers -productVersion)"
            echo
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          scripts/bench-compare.py ../conformance/out/release/bin/bench .build/release/XitDBBenchmark --passes 3 --raw "$out/raw" \
            | tee -a "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      # The summary and every pass's lines, kept with the run: `gh run download <run>` or the
      # run's page fetches them. Kept when the benchmark fails too, with what it got to.
      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-macos
          path: results/
          if-no-files-found: ignore

  compare-linux:
    name: Swift against Zig on Linux
    runs-on: [self-hosted, Linux]
    # The gate's container, and /nix for the runner's node, as in gate.yml.
    container:
      image: swift:6.4.2@sha256:119ff7d833ea622851b459513333bb4bda5ebb32b7acd05dd05077d5b0383129
      options: --volume /nix:/nix:ro
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CONFORMANCE_COMMIT: ${{ inputs.conformance_commit }}
      XITDB_COMMIT: ${{ inputs.xitdb_commit }}
    steps:
      - name: Check out the package
        uses: actions/checkout@v4
        with:
          path: xitdb-swift/package

      - name: Check out the conformance harness
        uses: actions/checkout@v4
        with:
          repository: rgb/xitdb-conformance
          ref: ${{ inputs.conformance_commit }}
          path: xitdb-swift/conformance
          token: ${{ secrets.CONFORMANCE_TOKEN || github.token }}

      - name: Check out the original xitdb
        uses: actions/checkout@v4
        with:
          repository: xit-vcs/xitdb
          ref: ${{ inputs.xitdb_commit }}
          path: xitdb

      - name: Install Python and xz
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 xz-utils > /dev/null

      # A third party's action on a public repository's self-hosted runner, so it is named
      # by commit; the comment says which release that is.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false

      - name: Check the toolchains
        run: |
          expected_swift="6.4.2"
          version=$(swift --version 2>&1)
          echo "$version"
          case "$version" in
            *"Swift version $expected_swift "*) ;;
            *)
              echo "::error::the benchmark needs Swift $expected_swift; the container's swift reports the version above"
              exit 1
              ;;
          esac
          expected_zig="0.17.1"
          zig_version=$(zig version)
          echo "zig $zig_version"
          if [ "$zig_version" != "$expected_zig" ]; then
            echo "::error::the benchmark needs Zig $expected_zig, and setup-zig installed $zig_version"
            exit 1
          fi

      - name: Build the Zig benchmark
        working-directory: xitdb-swift/conformance
        run: zig build -Doptimize=ReleaseFast --prefix out/release

      - name: Build the Swift benchmark
        working-directory: xitdb-swift/package
        run: swift build -c release --product XitDBBenchmark

      - name: Run both, three passes alternated
        working-directory: xitdb-swift/package
        run: |
          os=$(. /etc/os-release && echo "$PRETTY_NAME")
          out="$GITHUB_WORKSPACE/results"
          mkdir -p "$out"
          {
            echo "## Benchmark on Linux: Swift against Zig"
            echo
            echo "- Swift: \`${GITHUB_REPOSITORY}\` at \`${GITHUB_SHA}\`, $(swift --version 2>&1 | head -n 1)"
            echo "- Zig: \`rgb/xitdb-conformance\` at \`${CONFORMANCE_COMMIT}\` against \`xit-vcs/xitdb\` at \`${XITDB_COMMIT}\`, Zig $(zig version), ReleaseFast"
            echo "- Runner: $(uname -m), ${os} in a container, $(nproc) CPUs"
            echo
          } | tee "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/bench-compare.py ../conformance/out/release/bin/bench .build/release/XitDBBenchmark --passes 3 --raw "$out/raw" \
            | tee -a "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-linux
          path: results/
          if-no-files-found: ignore
